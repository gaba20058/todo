name: Docker Compose Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run with Docker Compose
        run: |
          docker compose version
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 15

      - name: Check container status
        run: docker compose ps

      - name: Test backend health (direct)
        run: |
          curl -f http://localhost:7345/ || (docker compose logs backend && exit 1)

      - name: Test frontend through Nginx
        run: |
          curl -f http://localhost/ || (docker compose logs frontend && exit 1)

      - name: Test database connection
        run: |
          docker compose exec -T db psql -U postgres -d todo_db -c "SELECT 1;"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs
          docker compose ps

      - name: Shutdown
        if: always()
        run: docker compose down -v